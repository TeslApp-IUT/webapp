name: teslapp
services:
  webapp:
    build: .
    ports:
      - '50025:80'
    env_file: .env
    restart: unless-stopped
    volumes:
      - ./docker/nginx.dev.conf:/etc/nginx/nginx.conf:ro
    networks:
      shared:
        ipv4_address: 172.22.0.6
    develop:
      watch:
        # Static assets: synced instantly, nginx serves them directly (no PHP/opcache).
        - action: sync
          path: ./www/_assets
          target: /var/www/html/_assets
        # PHP source: sync + restart to flush opcache immediately.
        - action: sync+restart
          path: ./www
          target: /var/www/html
          ignore:
            - _assets/
        - action: sync
          path: ./private
          target: /var/www/private
        # Image rebuild only when dependencies or server config change.
        - action: rebuild
          path: composer.json
        - action: rebuild
          path: composer.lock
        - action: rebuild
          path: Dockerfile
        - action: rebuild
          path: docker/

networks:
  shared:
    name: teslapp_shared
    external: true
