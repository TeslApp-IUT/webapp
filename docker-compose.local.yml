# Local development override
name: teslapp-local
services:
  webapp:
    build:
      args:
        INSTALL_XDEBUG: 'true'
    ports:
      - '50079:80'
    environment:
      XDEBUG_MODE: debug
      XDEBUG_CONFIG: 'client_host=host.docker.internal client_port=9003 start_with_request=yes start_upon_error=yes'
    networks:
      shared:
        ipv4_address: 172.22.0.11

networks:
  shared:
    external: false
    ipam:
      config:
        - subnet: 172.22.0.0/16
