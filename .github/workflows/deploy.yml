name: Deploy to Kárkharos
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
jobs:
  build:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: /home/feyli/iut/teslapp/webapp

      - name: Deploy webapp
        run: |
          cd /home/feyli/iut/teslapp
          docker compose up -d --build --force-recreate webapp
