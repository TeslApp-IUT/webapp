name: Deploy to Dev (Kárkharos)
on:
  push:
    branches: [ "development" ]

jobs:
  deploy-dev:
    runs-on: self-hosted
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Write .env
        run: echo '${{ secrets.WEBAPP_ENV_DEVELOPMENT }}' > $GITHUB_WORKSPACE/.env

      - name: Deploy to dev
        run: |
          cd $GITHUB_WORKSPACE
          export $(cat .env | xargs)
          docker compose build --no-cache
          docker compose up -d --force-recreate webapp
