worker_processes auto;
error_log /dev/stderr warn;
pid /run/nginx/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_types text/html text/css application/javascript application/json
               text/xml application/xml image/svg+xml;

    server {
        listen 80;
        root /var/www/html;
        index index.php;

        # No HTTPS redirect in local development.

        # Relaxed CSP: 'unsafe-inline' for dev tools, ws:/wss: for sockets.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "0" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self' https://tesla.com https://*.tesla.com; script-src 'self' https://tesla.com https://*.tesla.com; style-src 'self' 'unsafe-inline' https://tesla.com https://*.tesla.com; img-src 'self' data: https://tile.openstreetmap.org https://*.tile.openstreetmap.org https://tesla.com https://*.tesla.com; font-src 'self' https://tesla.com https://*.tesla.com; connect-src 'self' ws: wss: https://tesla.com https://*.tesla.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=(), usb=()" always;

        # Canonical redirect: /site/home → /
        location = /site/home {
            return 301 /;
        }

        # Block dot-files (e.g. .htaccess, .env).
        location ~ /\. {
            deny all;
        }

        # Front controller: serve real files/dirs, otherwise route through index.php.
        location / {
            try_files $uri $uri/ /index.php$is_args$args;
        }

        # PHP-FPM handler.
        location ~ \.php$ {
            fastcgi_split_path_info ^(.+\.php)(/.*)$;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_hide_header X-Powered-By;
            include fastcgi_params;
        }
    }
}
