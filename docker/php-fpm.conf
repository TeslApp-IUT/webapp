; PHP-FPM pool overrides for TeslApp, loaded after the stock www.conf
; (php-fpm.d includes are read in alphabetical order, hence the zz- filename).
;
; Wake-on-demand (VehicleWaker) holds a worker for up to ~20s per command sent
; to a sleeping vehicle (retry waits + Tesla round trips). The image default of
; pm.max_children = 5 would let a handful of concurrent commands starve the
; whole site, so widen the pool to keep regular page loads served meanwhile.

[www]
pm = dynamic
pm.max_children = 16
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
